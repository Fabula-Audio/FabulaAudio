plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'com.fabula.audio'
    compileSdk 35
    ndkVersion '26.3.11579264'
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig = true
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }

    defaultConfig {
        applicationId 'com.fabula.audio'
        minSdk 26
        targetSdk 35
        versionCode 35
        versionName '4.34'
        manifestPlaceholders.appLabel = 'Fabula Audio'
        // FFmpegKit 8.1.7 has no armeabi-v7a. Do not advertise an incomplete 32-bit ABI.
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildTypes {
        debug {
            minifyEnabled false
            if (project.hasProperty('parallelTestInstall')) {
                applicationIdSuffix '.test'
                versionNameSuffix '-test6'
                manifestPlaceholders.appLabel = 'Fabula Audio — тест'
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-audio:8.1.7'
    implementation 'com.arthenica:smart-exception-java:0.2.1'
}
